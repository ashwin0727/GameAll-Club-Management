name: gameall_player
description: "GameAll Player - view registrations, start memberships, book courts and follow tournaments."
# Private package — never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Same backend project as the club app (see env.json) — players read their own registrations,
  # memberships and bookings through Supabase with row-level security.
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.2
  # The one typeface of the GameAll design system (Manrope), fetched and cached at runtime
  # with a graceful fallback to the platform font when offline on first launch.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Native launcher icons, generated from the GameAll logo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/logo-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
