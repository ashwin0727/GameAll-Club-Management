name: gameall_player
description: "GameAll Play - view registrations, start memberships, book courts and follow tournaments."
# Private package — never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Same backend project as the club app (see env.json) — players read their own registrations,
  # memberships and bookings through Supabase with row-level security.
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  # Push notifications (Android): the same Firebase project and packages as the club app
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  # The payment receipt: built as a PDF in the app and downloaded (web) or shared (Android).
  pdf: ^3.11.3
  printing: ^5.14.2
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Native launcher icons, generated from the GameAll logo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  # An adaptive icon (dark background + the GameAll / PLAY artwork): the phone's own mask (round, squircle...) is cut from it, so
  # Android no longer puts the logo on a white backing shape.
  adaptive_icon_background: "#050C19"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Manrope is one variable font (the weight is an axis of the file); every weight points at it.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
